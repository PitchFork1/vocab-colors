<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary: Colours</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#1d2733;--accent:#19b5b0;--card:#e8f6f6;--pink:#fde1ea;--ok:#2e9e4f;--bad:#d93a3a;--line:#c9d3d8;--in:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--fg:#e8edf1;--accent:#2fd0ca;--card:#1d2b2e;--pink:#3a2630;--ok:#55c277;--bad:#ff6b6b;--line:#3a4650;--in:#1e262d}}
:root[data-theme="dark"]{--bg:#14191f;--fg:#e8edf1;--accent:#2fd0ca;--card:#1d2b2e;--pink:#3a2630;--ok:#55c277;--bad:#ff6b6b;--line:#3a4650;--in:#1e262d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:0 0 16px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
h1 span{color:var(--fg);text-transform:none;font-weight:500;margin-left:8px}
h2{font-size:1rem;margin:28px 0 10px}
h2 b{color:var(--accent);margin-right:6px}
.bank{background:var(--card);padding:10px 14px;border-radius:6px;display:flex;flex-wrap:wrap;gap:8px}
.bank button{background:var(--in);color:var(--fg);border:2px solid var(--line);padding:4px 12px;font-weight:500}
.bank button{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.bank button:hover{border-color:var(--accent)}
.item.over input{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.item.over .img{outline:3px dashed var(--accent)}
.ghost{position:fixed;z-index:99;pointer-events:none;padding:4px 12px;font-weight:700;background:var(--accent);color:#06201f;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.bank button.used{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px;margin-top:14px}
.item{text-align:center;position:relative;cursor:pointer}
.n{position:absolute;top:0;left:0;background:#e0457b;color:#fff;font-size:.75rem;font-weight:700;padding:0 6px;border-radius:3px;z-index:1}
.img{background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;height:120px;margin-bottom:6px;overflow:hidden}
.img img{max-width:100%;max-height:100%;display:block}
input{width:100%;box-sizing:border-box;padding:7px 8px;font:inherit;color:var(--fg);background:var(--in);border:2px solid var(--line);border-radius:6px}
input:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--ok)}input.bad{border-color:var(--bad)}
input:disabled{opacity:.7}
.pink{background:var(--pink);padding:16px;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;margin-bottom:10px}
.w{font-size:1.4rem;font-weight:800}
.w small{font-size:.8rem;font-weight:700;color:var(--fg);margin-right:6px}
.ex{font-style:italic;color:var(--accent)}
.s3{display:grid;grid-template-columns:1fr;gap:14px}
.s3 .it{display:flex;gap:12px;align-items:center}
.s3 .pic{flex:0 0 120px;position:relative}
.s3 .pic .img{height:84px;margin:0}
.s3 .inp{flex:1}
.bar{display:flex;align-items:center;gap:14px;margin-top:14px}
button{font:inherit;font-weight:700;background:var(--accent);color:#06201f;border:0;border-radius:6px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.score{font-weight:700}
.total{margin-top:32px;padding:16px;text-align:center;font-size:1.3rem;font-weight:800;background:var(--card);border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Vocabulary <span>Colours</span></h1>

<h2><b>1</b>Match the colours to the words.</h2>

<h2><b>2</b>Say the colour, not the word!</h2>
<div class="pink" id="g2"></div>

<h2><b>3</b>Write sentences.</h2>

const C={orange:"#f59a2b",blue:"#2f8fd8",green:"#5bb450",grey:"#999",red:"#e8403a",black:"#333",white:"#fff",yellow:"#f6d21c",brown:"#8a5a3a"};
const ex1=[["orange",1,true],["blue",2],["green",3],["grey",4],["red",5],["black",6],["white",7],["yellow",8],["brown",9]];
const ex2=[["black","yellow",0],["blue","red",1],["brown","grey",2],["green","orange",3],["grey","brown",4],["orange","black",5],["red","green",6],["white","blue",7],["yellow","white",8]];
const ex3=[["pencil","yellow",0],["pencil case","red",1],["apple","green",2],["pen","blue",3],["book","yellow",4],["ruler","black",5]];
const max={1:8,2:8,3:5},score={1:0,2:0,3:0};

const bank=document.getElementById("bank");
["black","blue","brown","green","grey","orange","red","white","yellow"].forEach(w=>{
  bank.insertAdjacentHTML("beforeend",`<button data-w="${w}">${w}</button>`);
});

const g1=document.getElementById("g1");
ex1.forEach(([c,n,ex])=>{
  g1.insertAdjacentHTML("beforeend",`<div class="item"><span class="n">${n}</span><div class="img"><img src="${IMG["s"+n]}" alt=""></div><input ${ex?`value="${c}" disabled`:`data-a="${c}" data-g="1" autocomplete="off" autocapitalize="off"`}></div>`);
});

const g2=document.getElementById("g2");
ex2.forEach(([w,c,n])=>{
  const st=`color:${C[c]};${c=="white"?"text-shadow:-1px -1px 0 #333,1px -1px 0 #333,-1px 1px 0 #333,1px 1px 0 #333;":""}`;
  g2.insertAdjacentHTML("beforeend",`<div class="row"><div class="w"><small>${n}</small><span style="${st}">${w}</span></div>${n==0?`<span class="ex">${c}</span>`:`<input data-a="${c}" data-g="2" autocomplete="off" autocapitalize="off">`}</div>`);
});

const g3=document.getElementById("g3");
ex3.forEach(([o,c,n])=>{
  g3.insertAdjacentHTML("beforeend",`<div class="it"><div class="pic"><span class="n">${n}</span><div class="img"><img src="${IMG["p"+n]}" alt=""></div></div><div class="inp">${n==0?`<span class="ex">The pencil is yellow.</span>`:`<input data-a="${c}" data-o="${o}" data-g="3" placeholder="The ${o} is ..." autocomplete="off" autocapitalize="off">`}</div></div>`);
});

const norm=s=>s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
function ok(el){
  const v=norm(el.value),a=el.dataset.a;
  if(el.dataset.g!="3")return v==a;
  const o=el.dataset.o;
  return ["the","my","this","a"].some(d=>v==`${d} ${o} is ${a}`);
}
function inputs(g){return [...document.querySelectorAll(`input[data-g="${g}"]`)]}
function refresh(){
  [1,2,3].forEach(g=>{document.getElementById("b"+g).disabled=inputs(g).some(i=>!i.value.trim())});
  const used=inputs(1).map(i=>norm(i.value));
  bank.querySelectorAll("button").forEach(b=>b.classList.toggle("used",used.includes(b.dataset.w)));
}
let cur=null;
document.querySelectorAll("input[data-g]").forEach(el=>{
  el.addEventListener("input",()=>{el.classList.remove("ok","bad");refresh()});
  el.addEventListener("focus",()=>{if(el.dataset.g=="1")cur=el});
});
g1.querySelectorAll(".item").forEach(it=>it.addEventListener("click",()=>{const i=it.querySelector("input");if(!i.disabled)i.focus()}));
function put(t,w){
  t.value=w;t.classList.remove("ok","bad");
  const list=inputs(1);cur=list.find(i=>!i.value.trim())||null;
  refresh();
}
bank.addEventListener("pointerdown",e=>{
  const b=e.target.closest("button");if(!b)return;
  e.preventDefault();
  const w=b.dataset.w,sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
  const move=ev=>{
    if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
      ghost=document.createElement("div");ghost.className="ghost";ghost.textContent=w;document.body.appendChild(ghost);
    }
    if(!ghost)return;
    ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";
    const el=document.elementFromPoint(ev.clientX,ev.clientY);
    const it=el&&el.closest("#g1 .item");
    const tgt=it&&!it.querySelector("input").disabled?it:null;
    if(over!==tgt){if(over)over.classList.remove("over");over=tgt;if(over)over.classList.add("over")}
  };
  const up=ev=>{
    document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
    if(ghost){
      ghost.remove();
      if(over){over.classList.remove("over");put(over.querySelector("input"),w)}
    }else{
      const list=inputs(1);
      const t=(cur&&!cur.disabled)?cur:list.find(i=>!i.value.trim());
      if(t)put(t,w);
    }
  };
  document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
});
function check(g){
  let s=0;
  inputs(g).forEach(el=>{
    const r=ok(el);if(r)s++;
    el.classList.toggle("ok",r);el.classList.toggle("bad",!r);
  });
  score[g]=s;
  document.getElementById("s"+g).textContent=`Score: ${s} / ${max[g]}`;
  document.getElementById("total").textContent=`Total score: ${score[1]+score[2]+score[3]} / 21`;
}
</script>
</body>
</html>
